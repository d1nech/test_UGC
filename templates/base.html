{% load static %}
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Опросы{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
</head>
<body>
  <header class="topbar">
    <a href="{% url 'survey-list' %}" class="brand">
      <span class="brand-icon">О</span>
      <span>Опросы</span>
    </a>
    <a href="/admin/" class="admin-link">Админка</a>
  </header>
  <main class="page">
    {% if messages %}
      <div class="messages">
        {% for message in messages %}<div class="message {{ message.tags }}">{{ message }}</div>{% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
